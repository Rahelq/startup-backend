openapi: 3.0.0
info:
  title: Startup Connect Backend API
  description: Complete backend API for Startup Connect platform
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.startupconnect.dev
    description: Production server
paths:
  /:
    get:
      summary: Health check
      description: Check if database is connected
      responses:
        '200':
          description: Database connected successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  time:
                    type: object
  /api/auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                role:
                  type: string
                  enum: [Admin, Startup, Investor, Mentor]
              required: [email, password]
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                  refreshToken:
                    type: string
        '400':
          description: Validation error
        '409':
          description: User already exists
  /api/auth/login:
    post:
      summary: Login user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  refreshToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
        '404':
          description: User not found
  /api/auth/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required: [refreshToken]
      responses:
        '200':
          description: New access token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Invalid or expired refresh token
  /api/users/profile:
    get:
      summary: Get user profile
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
    put:
      summary: Update user profile
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Access denied
components:
  schemas:
    User:
      type: object
      properties:
        user_id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [Admin, Startup, Investor, Mentor]
        is_approved:
          type: boolean
        is_active:
          type: boolean
    Startup:
      type: object
      properties:
        startup_id:
          type: integer
        user_id:
          type: integer
        startup_name:
          type: string
        industry:
          type: string
        description:
          type: string
        business_stage:
          type: string
        founded_year:
          type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

# Ratings & Feedback
paths:
  /api/ratings:
    post:
      summary: Create a rating
      tags: [Ratings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingInput'
      responses:
        '201':
          description: Rating created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'

  /api/ratings/{entityType}/{entityId}:
    get:
      summary: List ratings for an entity
      tags: [Ratings]
      security:
        - bearerAuth: []
      parameters:
        - name: entityType
          in: path
          required: true
          schema:
            type: string
        - name: entityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ratings list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ratings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Rating'

  /api/ratings/{id}/report:
    post:
      summary: Report a rating for moderation
      tags: [Ratings]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Report submitted

  /api/reputation/{userId}:
    get:
      summary: Get reputation score for a user
      tags: [Reputation]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reputation score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReputationScore'

# Admin moderation surface (restricted to Admin role)
  /api/admin/ratings:
    get:
      summary: List ratings for moderation (admin)
      tags: [Admin, Ratings]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Moderation queue

  /api/admin/ratings/reports:
    get:
      summary: List reported ratings
      tags: [Admin, Ratings]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Report list

  /api/admin/ratings/{ratingId}/hide:
    put:
      summary: Hide a rating (admin)
      tags: [Admin, Ratings]
      security:
        - bearerAuth: []
      parameters:
        - name: ratingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Rating hidden

  /api/admin/ratings/{ratingId}/remove:
    put:
      summary: Remove a rating (admin)
      tags: [Admin, Ratings]
      security:
        - bearerAuth: []
      parameters:
        - name: ratingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Rating removed

components:
  schemas:
    RatingInput:
      type: object
      properties:
        relationship_id:
          type: integer
        relationship_type:
          type: string
        entity_type:
          type: string
          enum: [mentor, startup, investor, session, meeting, project, milestone, relationship]
        entity_id:
          type: integer
        reviewed_user_id:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
        review:
          type: string
        is_anonymous:
          type: boolean

    Rating:
      type: object
      properties:
        id:
          type: integer
        reviewer_id:
          type: integer
        reviewed_user_id:
          type: integer
        rating:
          type: integer
        review:
          type: string
        created_at:
          type: string
          format: date-time

    ReputationScore:
      type: object
      properties:
        user_id:
          type: integer
        trust_score:
          type: number
        engagement_score:
          type: number
        completion_score:
          type: number
        response_score:
          type: number
        calculated_at:
          type: string
          format: date-time
